name: Automated YouTube Pipeline Runner

on:
  schedule:
    # 11:45 PM IST = 18:15 UTC
    - cron: '15 18 * * *'
    # 02:00 AM IST = 20:30 UTC
    - cron: '30 20 * * *'
  # Manual trigger button in GitHub UI
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install httpx python-dotenv google-api-python-client google-auth google-auth-oauthlib pillow

      - name: Reconstruct Credentials
        env:
          ENV_SECRETS: ${{ secrets.ENV_FILE_CONTENT }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON_CONTENT }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON_CONTENT }}
        run: |
          echo "$ENV_SECRETS" > .env
          if [ -n "$TOKEN_JSON" ]; then echo "$TOKEN_JSON" > token.json; fi
          if [ -n "$CLIENT_SECRETS_JSON" ]; then echo "$CLIENT_SECRETS_JSON" > client_secrets.json; fi

      - name: Run Full Production Pipeline
        run: |
         python orchestrator.py --full --force

      - name: Upload Workspace Artifacts (Debug & Backups)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-output
          path: workspace/
          retention-days: 3
